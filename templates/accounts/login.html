{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<form method="post" class="auth-form">
    <h1>Вход в аккаунт</h1>
    <p class="description">Войдите, чтобы продолжить покупки.</p>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Войти</button>
    <p class="auth-note">Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрируйтесь</a></p>
</form>
{% endblock %}
